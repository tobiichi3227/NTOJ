name: fuzz-nightly

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  property-fuzz:
    name: Hypothesis nightly fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: nightly
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: poetry

      - name: Install application and fuzz dependencies
        run: |
          poetry install
          poetry run python -m pip install -r src/tests/fuzz/requirements.txt

      - name: Run deep property fuzz
        run: poetry run bash src/tests/fuzz/run-smoke.sh

      - name: Upload minimized failing examples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-nightly-failures
          path: src/.hypothesis/
          include-hidden-files: true
          if-no-files-found: ignore
