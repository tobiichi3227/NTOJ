[pytest]
testpaths = .
python_files = test_*.py
addopts = --browser chromium --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results
markers =
    smoke: public shell and SPA navigation checks
    auth: account registration, login, logout, and session checks
    standard: standard-site user workflows
    admin: workflows that require a kernel account
    contest: contest workflows
    realtime: browser WebSocket workflows
    judge: workflows that require an online judge and a configured problem
    allow_browser_error(message): allow one documented browser error fragment for this test
